plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ricardocorreia.personal'
version = '0.0.1-SNAPSHOT'
description = 'tiny-ledger'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.mapstruct:mapstruct:1.6.3'

    compileOnly 'org.projectlombok:lombok'

    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation platform('org.instancio:instancio-bom:6.1.0')
    testImplementation 'org.instancio:instancio-junit'

}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.15'
}

def coverageExclusions = [
    '**/scripts/SampleData*.class',
    '**/TinyLedgerApplication.class',
]

def productionClassesWithoutExclusions = sourceSets.main.output.classesDirs
def productionClassesForCoverage = files(productionClassesWithoutExclusions.files.collect { classesDir ->
    fileTree(dir: classesDir, exclude: coverageExclusions)
})

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    classDirectories.setFrom(productionClassesForCoverage)
    reports {
        html.required = true
        xml.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    classDirectories.setFrom(productionClassesForCoverage)
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.register('seedSampleData', JavaExec) {
    group = 'application'
    description = 'Create sample accounts and transactions in a running Tiny Ledger application.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ricardocorreia.personal.tinyledger.scripts.SampleData'
    args(providers.gradleProperty('baseUrl').getOrElse('http://localhost:8080'))
}
